{% extends "base.html" %}
{% block titulo %}Novo animal{% endblock %}
{% block conteudo %}
<h1>Novo animal</h1>
<p class="subtitulo">A espécie é definida pela raça. Para animais sem raça definida, escolha "SRD" da espécie correta.</p>
<section class="cartao">
  <form class="formulario" method="post">
    <label>Nome *
      <input name="nome" required maxlength="60" value="{{ form.get('nome', '') }}"></label>
    <label>Sexo *
      <select name="sexo" required>
        <option value="">Selecione</option>
        <option value="M" {{ 'selected' if form.get('sexo') == 'M' }}>Macho</option>
        <option value="F" {{ 'selected' if form.get('sexo') == 'F' }}>Fêmea</option>
      </select></label>
    <label>Data de nascimento <small>deixe em branco se desconhecida</small>
      <input name="data_nascimento" type="date" value="{{ form.get('data_nascimento', '') }}"></label>
    <label>Tutor *
      <select name="id_tutor" required>
        <option value="">Selecione</option>
        {% for t in tutores %}
          <option value="{{ t.id_tutor }}" {{ 'selected' if form.get('id_tutor') | string == t.id_tutor | string }}>{{ t.nome }}</option>
        {% endfor %}
      </select></label>
    <label>Raça *
      <select name="id_raca" required>
        <option value="">Selecione</option>
        {% for especie, grupo in racas | groupby('especie') %}
          <optgroup label="{{ especie }}">
          {% for r in grupo %}
            <option value="{{ r.id_raca }}" {{ 'selected' if form.get('id_raca') | string == r.id_raca | string }}>{{ r.nome }}</option>
          {% endfor %}
          </optgroup>
        {% endfor %}
      </select></label>
    <div class="inteiro acoes">
      <button type="submit">Salvar animal</button>
      <a class="botao secundario" href="{{ url_for('main.animais') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
