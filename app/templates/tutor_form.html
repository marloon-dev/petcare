{% extends "base.html" %}
{% from "_macros.html" import icone, obrig %}
{% block titulo %}Novo tutor{% endblock %}
{% block conteudo %}
<a class="migalha" href="{{ url_for('main.tutores') }}">{{ icone('voltar', 'p') }}Tutores</a>
<div class="pagina-topo">
  <div><h1>Novo tutor</h1><p class="subtitulo">Campos com <span class="obrigatorio">*</span> são obrigatórios.</p></div>
</div>
<section class="cartao"><div class="cartao-corpo">
  <form class="formulario" method="post">
    <p class="secao-form">Dados pessoais</p>
    <label class="inteiro">Nome completo {{ obrig() }}
      <input name="nome" required maxlength="100" autocomplete="name" value="{{ form.get('nome', '') }}"></label>
    <label>CPF {{ obrig() }}
      <input name="cpf" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00" value="{{ form.get('cpf', '') }}"></label>
    <label>E-mail
      <input name="email" type="email" maxlength="100" autocomplete="email" placeholder="nome@exemplo.com" value="{{ form.get('email', '') }}"></label>

    <p class="secao-form">Telefones</p>
    <label>Celular {{ obrig() }} <small>com DDD</small>
      <input name="celular" required inputmode="tel" maxlength="15" autocomplete="tel" placeholder="(11) 90000-0000" value="{{ form.get('celular', '') }}"></label>
    <label>Outro telefone
      <input name="telefone2" inputmode="tel" maxlength="15" placeholder="(11) 0000-0000" value="{{ form.get('telefone2', '') }}"></label>
    <label>Tipo do outro telefone
      <select name="tipo2">
        {% for tipo in tipos_telefone if tipo != 'Celular' %}
          <option {{ 'selected' if form.get('tipo2') == tipo }}>{{ tipo }}</option>
        {% endfor %}
      </select></label>

    <p class="secao-form">Endereço</p>
    <label>CEP {{ obrig() }}
      <input name="cep" required inputmode="numeric" maxlength="9" autocomplete="postal-code" placeholder="00000-000" value="{{ form.get('cep', '') }}"></label>
    <label class="inteiro">Logradouro {{ obrig() }}
      <input name="logradouro" required maxlength="120" autocomplete="address-line1" value="{{ form.get('logradouro', '') }}"></label>
    <label>Número {{ obrig() }}
      <input name="numero" required maxlength="10" value="{{ form.get('numero', '') }}"></label>
    <label>Complemento
      <input name="complemento" maxlength="60" autocomplete="address-line2" value="{{ form.get('complemento', '') }}"></label>
    <label>Bairro {{ obrig() }}
      <input name="bairro" required maxlength="60" value="{{ form.get('bairro', '') }}"></label>
    <label>Cidade {{ obrig() }}
      <input name="cidade" required maxlength="60" autocomplete="address-level2" value="{{ form.get('cidade', '') }}"></label>
    <label>UF {{ obrig() }}
      <select name="uf" required autocomplete="address-level1">
        <option value="">Selecione</option>
        {% for uf in ufs %}<option {{ 'selected' if form.get('uf', '').upper() == uf }}>{{ uf }}</option>{% endfor %}
      </select></label>

    <div class="form-acoes">
      <button type="submit">{{ icone('check', 'p') }}Salvar tutor</button>
      <a class="botao secundario" href="{{ url_for('main.tutores') }}">Cancelar</a>
    </div>
  </form>
</div></section>
{% endblock %}
